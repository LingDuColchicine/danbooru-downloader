<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danbooru Downloader</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-menu" aria-label="Primary navigation">
        <div class="menu-brand">
          <div class="menu-title" aria-label="Menu">
            <span class="nav-icon icon-menu" aria-hidden="true"></span>
            <span data-i18n="nav.menu">Menu</span>
          </div>
        </div>

        <nav class="nav-list" aria-label="Main sections">
          <button class="nav-button active" type="button" data-page="search" aria-label="Search">
            <span class="nav-icon icon-search" aria-hidden="true"></span>
            <span data-i18n="nav.search">Search</span>
          </button>
          <button class="nav-button" type="button" data-page="favorites" aria-label="Favorites">
            <span class="nav-icon icon-heart" aria-hidden="true"></span>
            <span data-i18n="nav.favorites">Favorites</span>
          </button>
          <button class="nav-button" type="button" data-page="settings" aria-label="Settings">
            <span class="nav-icon icon-settings" aria-hidden="true"></span>
            <span data-i18n="nav.settings">Settings</span>
          </button>
        </nav>
      </aside>

      <main class="page-content" aria-live="polite">
        <section class="page-panel active" data-page-panel="search">
          <div class="search-workspace">
            <div class="search-header">
              <h1 data-i18n="search.title">Search</h1>
            </div>

            <div class="tag-search" id="tag-search">
              <div class="tag-input-shell" id="tag-input-shell">
                <div class="selected-tags" id="selected-tags" aria-label="Selected tags"></div>
                <input
                  id="tag-input"
                  class="tag-input"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  data-i18n-placeholder="search.placeholder"
                  placeholder="Type tags..."
                  aria-label="Search tags"
                >
                <div class="search-actions">
                  <button class="icon-button" id="confirm-search" type="button" aria-label="Search">
                    <span class="action-icon icon-search-check" aria-hidden="true"></span>
                  </button>
                  <button class="icon-button" id="clear-search" type="button" aria-label="Clear">
                    <span class="action-icon icon-trash" aria-hidden="true"></span>
                  </button>
                </div>
              </div>

              <div class="suggestions-panel" id="suggestions-panel" hidden>
                <div class="suggestions-list" id="suggestions-list" role="listbox" aria-label="Tag suggestions"></div>
              </div>
            </div>
          </div>
        </section>
        <section class="page-panel" data-page-panel="favorites">
          <span>2</span>
        </section>
        <section class="page-panel" data-page-panel="settings">
          <span>3</span>
        </section>
      </main>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
